# SDWIS laboratory-results analyte mapping for southbay-water.
#
# One entry per Analyte Code ("STORET"-style code, column "Analyte Code") that appears in the
# Santa Clara County rows of the State Water Board EDT library files (SDWIS4.tab / SDWIS5.tab).
# Generated from the data and then assigned by hand; src/pipeline/sdwis_extract.py reads it.
#
# Fields
#   storet      Analyte Code exactly as in the file (string; some codes start with a letter)
#   raw_name    Analyte Name as spelled in the file (trailing padding removed)
#   unit        Units of Measure seen in the data for this code (informational; the extract keeps
#               the unit each row carries and never converts)
#   id          canonical id from config/analytes.yaml, or null when the catalogue has no entry
#   unit_label  optional. When set, the extract reports this string as the unit instead of the
#               one in the data, e.g. "MG/L as NO3" if a nitrate code ever turns out to be
#               reported as NO3 rather than as N. Not needed for the current data: code 1040
#               NITRATE carries MCL 10 / DLR 0.4, i.e. it is reported as N.
#   notes       free text
#
# Matching: the extract matches on storet first; if a row's code is not listed it falls back to
# the raw_name (case-insensitive, trimmed). Unlisted analytes are kept with id null.
#
# Catalogue analytes with no SDWIS rows for these systems (so no entry here): chlorine_residual,
# chloramines, total_coliform, e_coli, heterotrophic_bacteria, radon, molybdenum, ndma, nmor,
# pfas_total.
