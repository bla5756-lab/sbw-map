# Canonical analyte catalogue for southbay-water.
#
# One entry per analyte the map can display. Standards are California drinking-water standards
# (Title 22 CCR) unless noted; where California has no standard the federal value is given and
# marked. `threshold_type`:
#   MCL   maximum contaminant level (primary, health based)
#   AL    action level (lead/copper, 90th percentile of tap samples)
#   MRDL  maximum residual disinfectant level
#   SMCL  secondary MCL (aesthetic: taste, odor, color)
#   TT    treatment technique (turbidity, microbial) - numeric limit given where one exists
#   NL    notification level (California, advisory, not enforceable)
#   RANGE recommended range (pH) - threshold_low/threshold_high
#   NONE  no standard; the map scales relative to the other systems
# `phg` = California Public Health Goal (OEHHA) or federal MCLG where marked.
# `unit` is the canonical unit values are stored in; `aliases` are names as printed in CCRs.
# ppb = ug/L, ppm = mg/L, ppt = ng/L.

groups:
  inorganic: Inorganic contaminants
  radiological: Radioactive contaminants
  disinfection: Disinfectants and disinfection byproducts
  lead_copper: Lead and copper (at the tap)
  microbial: Microbial
  organic: Organic and volatile organic contaminants
  pfas: PFAS (unregulated / notification levels)
  secondary: Secondary standards (aesthetic)
  general: General mineral and physical (no standard)

